components:
  schemas:
    Bookings:
      properties:
        id:
          type: number
          example: 67
        userId:
          type: object
          $ref: "#/components/schemas/User"
        sessionid:
          type: object
          $ref: "#/components/schemas/Sessions"
    Posts:
      properties:
        id:
          type: number
          example: 45
        postContent:
          type: string
          example: "Can't wait to try out the westlake gym!"
        userId:
          type: object
          $ref: "#/components/schemas/User"
    Activities:
      properties:
        id:
          type: number
          example: 7
        activityTitle:
          type: string
          example: 'Boxing'
        activityDescription:
          type: string
          example: 'An awesome combat sport that only allows for punches'
    Sessions:
      properties:
        id:
          type: number
          example: 83
        sessionTime:
          type: string
          example: "14:00:00"
        sessionDate:
          type: string
          example: "2025-12-17"
        activityId:
          type: object
          $ref: "#/components/schemas/Activities"
        trainerId:
          type: object
          $ref: "#/components/schemas/User"
        locationId:
          type: object
          $ref: "#/components/schemas/Location"
    Location:
      properties:
        id:
          type: number
          example: 3
        locationTitle:
          type: string
          example: 'Ashgrove High Street Gym'
        locationAddress:
          type: string
          example: 'Ashburton Lane 31'
    AuthenticationKey:
      type: object
      required:
        - key
      properties:
        key:
          type: string
          format: uuid
    User:
      type: object
      required:
        - email
        - password
      properties:
        id:
          type: number
          example: 1
        firstName:
          type: string
          example: "Jane"
        lastName:
          type: string
          example: "Doe"
        role:
          type: string
          example: "Member"
          enum: [Admin, Trainer, Member]
        email:
          type: string
          example: "hello@gmail.com"
        password:
          type: string
          example: "abc123"
        address:
          type: string
          example: '28 Dew Avenue'  
        phoneNumber:
          type: string
          example: "044342743432"
        gymId:
          type: object
          $ref: "#/components/schemas/Location"
        authenticationKey:
          type: string
          example: "13dad9d9-a6c4-4374-a570-67563883f3e9"
  responses:
    LoginSuccessful:
      description: "Login successful"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthenticationKey"
    SignupSuccessful:
      description: "Signup successful"
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Account successfully created"
    Updated:
      description: "An item was updated"
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Item updated"
    Created:
      description: "A new item was created"
      content:
        application/json:
          schema:
            type: object
            required:
              - id
              - message
            properties:
              id:
                type: number
                example: 1
              message:
                type: string
                example: "Item created"
    NotFound:
      description: "Item not found"
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
                example: "Item not found"
    Error:
      description: "An error has occurred"
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
                example: "Something went wrong"
              errors:
                type: array
